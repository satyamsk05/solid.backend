version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solidgame_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solidgame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: solidgame_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
